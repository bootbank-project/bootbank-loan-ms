databaseChangeLog:
  - changeSet:
      id: createTable-loans
      author: saadat
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS bootbank_loan_db
        - createTable:
            schemaName: bootbank_loan_db
            tableName: loans
            columns:
              - column:
                  name: ID
                  type: bigint
                  autoIncrement: true
                  startWith: 1
                  incrementBy: 1
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: CIF
                  type: varchar(7)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: varchar2(255)
                  constraints:
                    nullable: false
              - column:
                  name: TYPE
                  type: varchar2(255)
                  constraints:
                    nullable: false
              - column:
                  name: AMOUNT
                  type: java.sql.Types.NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: RATE
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: MONTHLY_PAYMENT
                  type: java.sql.Types.NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: CURRENCY
                  type: varchar2(10)
                  constraints:
                    nullable: false
              - column:
                  name: START_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: END_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: STATUS
                  type: varchar2(25)
                  constraints:
                    nullable: false
              - column:
                  name: REMAINING
                  type: JAVA.SQL.TYPES.NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: TOTAL_PAID
                  type: JAVA.SQL.TYPES.NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: PAYMENTS_LEFT
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: NEXT_PAYMENT_DATE
                  type: DATE
                  constraints:
                    nullable: false

  - changeSet:
     id: addIndex-loans-cif
     author: saadat
     changes:
       - createIndex:
           indexName: idx_loans_cif
           tableName: loans
           schemaName: bootbank_loan_db
           columns:
             - column:
                 name: CIF

databaseChangeLog:
  - logicalFilePath: 01-create-table-loan.yaml
  - changeSet:
      id: 01
      author: Saadat
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS bootbank_loan_db
        - createSequence:
            schemaName: bootbank_loan_db
            sequenceName: LOAN_SEQ
            startValue: 1
            incrementBy: 1

  - changeSet:
      id: 02
      author: Saadat
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS bootbank_loan_db
        - createTable:
            tableName: LOAN
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: CIF
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: NAME
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: TYPE
                  type: varchar2(255)
                  constraints:
                    nullable: false
              - column:
                  name: AMOUNT
                  type: numeric(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: RATE
                  type: numeric
                  constraints:
                    nullable: false
              - column:
                  name: MONTHLY_PAYMENT
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: CURRENCY
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: START_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: END_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: STATUS
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: REMAINING
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: TOTAL_PAID
                  type: NUMERIC(15, 2)
                  constraints:
                    nullable: false
              - column:
                  name: PAYMENTS_LEFT
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: NEXT_PAYMENT_DATE
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false


